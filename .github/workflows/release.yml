name: Publish Python packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install packaging
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          PREVIOUS: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            python scripts/release.py detect --previous "$PREVIOUS" --output "$GITHUB_OUTPUT"
          else
            python scripts/release.py detect --output "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install '.[dev]'
      - name: Fetch the checksum-pinned GitHub data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release download "v${RELEASE_VERSION}" --pattern "parascape-data-${RELEASE_VERSION}.tar.gz" --dir data-dist
      - name: Release checks
        run: |
          python scripts/release.py check
          python -m pytest tests/test_release.py tests/test_wheel.py tests/test_packaging.py tests/test_readme.py tests/test_docstrings.py tests/test_paths.py tests/test_app_smoke.py tests/test_app_polish.py tests/test_discover_cli.py tests/test_importer.py tests/test_data_download.py tests/test_rna_profiles.py tests/test_rna_design.py tests/test_rna_snapshot.py tests/test_rna_bundled.py tests/test_published_expression.py tests/test_source_matrices.py tests/test_measurement_qc.py tests/test_dataset_coverage_panel.py tests/test_data_release_builder.py -q
      - name: Build wheels and source distributions
        run: |
          python -m build
          python scripts/check_wheel.py dist
          python -m twine check --strict dist/*
      - name: Smoke test installed wheel outside the checkout
        env:
          PARASCAPE_CACHE: /tmp/parascape-release-data
          PARASCAPE_DATA_ARCHIVE: ${{ github.workspace }}/data-dist/parascape-data-${{ needs.version.outputs.version }}.tar.gz
        run: |
          python -m venv --system-site-packages /tmp/parascape-wheel
          /tmp/parascape-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/parascape-wheel/bin/python -I -c 'import os; from parascape import data_manager as D; assert not D.status()["ready"]; D.install_archive(os.environ["PARASCAPE_DATA_ARCHIVE"]); from parascape import paths; from parascape.app import load; assert D.status()["ready"]; assert paths.check()[0]; assert len(load()[0]) > 1000'
          /tmp/parascape-wheel/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke_installed_expression.py"
          /tmp/parascape-wheel/bin/parascape-discover --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parascape/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Attach distributions after PyPI publication
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish release notes and distribution files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            for file in dist/*; do
              asset=$(basename "$file")
              if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release upload "$tag" "$file"
              fi
            done
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "ParaScape $RELEASE_VERSION" \
            --generate-notes "${flags[@]}"
