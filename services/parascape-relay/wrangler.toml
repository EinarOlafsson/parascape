name = "parascape-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "parascape-support"
database_id = "24947849-11dc-40bd-9d9a-0fcf9293f8b4"

[vars]
APP_ID = "5647965"
INSTALLATION_ID = "179382040"
REPO = "EinarOlafsson/parascape"
AI_MODEL_BEST = "@cf/google/gemma-4-26b-a4b-it"
AI_MODEL_LIGHT = "@cf/meta/llama-3.1-8b-instruct-fp8"
AI_BEST_PER_INSTALL = "0"
AI_LIGHT_PER_INSTALL = "0"
AI_DAILY_NEURON_CAP = "4000"
AI_MIN_SHARE_NEURONS = "300"
AI_LIGHT_THRESHOLD = "0.4"
REPORTS_PER_INSTALL = "5"
DAILY_REPORT_LIMIT = "200"
PER_IP_DAILY_LIMIT = "60"
AI_CACHE_MAX_ROWS = "20000"
AI_CACHE_MAX_BYTES = "60000000"
AI_CACHE_TTL_DAYS = "30"

# Secrets (never in this file):
#   GITHUB_APP_PRIVATE_KEY  required, PKCS#8 PEM (see README.md)
#   IP_HASH_SALT            optional, any long random string
