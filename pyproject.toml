[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parascape"
version = "0.0.6.0"
description = "Explore gene evidence and screen results in Toxoplasma and Plasmodium"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Einar Olafsson", email = "einar.olafsson@gmail.com"}]
keywords = ["toxoplasma", "plasmodium", "bioinformatics", "CRISPR", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pypdf>=4.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "threadpoolctl>=3.1",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.4", "build>=1.2", "twine>=6", "tomli>=2; python_version < '3.11'"]
docs = ["pdoc>=15,<17", "markdown2>=2.5,<3"]
ingest = ["pyBigWig>=0.3"]
sequence = ["torch>=2.1", "transformers>=4.40,<5", "biopython>=1.84"]
structures = ["gemmi>=0.7", "biopython>=1.84"]
gpu = [
    "cuml-cu12>=24.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cupy-cuda12x>=13.0; sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[project.scripts]
parascape = "parascape.app:main"
parascape-encode-proteins = "parascape.sequence_features:main"
parascape-index-structures = "parascape.structure_catalog:main"
parascape-discover = "parascape.discover:main"
parascape-install-gpu = "parascape.install_gpu:main"
parascape-expression = "parascape.rna_profiles:main"
parascape-data = "parascape.data_manager:main"

[project.urls]
Homepage = "https://github.com/EinarOlafsson/parascape"
Documentation = "https://einarolafsson.github.io/parascape/"
Issues = "https://github.com/EinarOlafsson/parascape/issues"
Changelog = "https://github.com/EinarOlafsson/parascape/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["parascape", "parascape.spaces"]
include-package-data = false

[tool.setuptools.package-data]
parascape = ["data_manifest.json", "data/icons/*.svg"]

[tool.setuptools.exclude-package-data]
parascape = ["data/embeddings/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real build or a full documentation pass; minutes rather than seconds"]
